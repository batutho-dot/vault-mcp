[project]
name = "vault-mcp"
version = "0.1.0"
description = "A read-only MCP server over a folder of Markdown notes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
vault-mcp = "vault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
