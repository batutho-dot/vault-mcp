[project]
name = "vault-mcp"
version = "0.1.0"
description = "A read-only MCP server over a folder of Markdown notes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "obsidian", "markdown", "read-only"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.urls]
Repository = "https://github.com/batutho-dot/vault-mcp"

[project.scripts]
vault-mcp = "vault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_mcp"]

# Ship the toy vault inside the package, so `pip install .` and `uvx` can serve it too.
[tool.hatch.build.targets.wheel.force-include]
"toy-vault" = "vault_mcp/toy-vault"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
